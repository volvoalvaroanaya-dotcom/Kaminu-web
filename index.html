<style>
:root {
  /* Kaminu: light, airy, one deep-night block for safety. Big type, few words. */
  --paper: #F6F7FB;
  --card: #FFFFFF;
  --ink: #0D1330;
  --muted: #5B6482;
  --line: #E3E6F0;
  --blue: #2F7BFF;
  --night: #16183A;
  --night-ink: #EEF1FF;
  --display: "Bricolage Grotesque", "SF Pro Display", -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans CJK SC", "Noto Sans Arabic", system-ui, sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans CJK SC", "Noto Sans Arabic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; border-radius: 8px; }
.wrap { width: min(1120px, 100% - 40px); margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.03em; line-height: 1.02; margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }

/* Header */
header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--paper) 78%, transparent); backdrop-filter: saturate(1.6) blur(18px); -webkit-backdrop-filter: saturate(1.6) blur(18px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.03em; text-decoration: none; }
.brand img { width: 34px; height: auto; }
.bar-right { display: flex; align-items: center; gap: 10px; }
select { font: 500 14px var(--body); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; }
.pill { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--body); background: var(--ink); color: #fff; border: 0; border-radius: 999px; padding: 10px 18px; text-decoration: none; cursor: pointer; }
.pill:hover { background: #1d2550; }

/* Hero */
.hero { padding: 72px 0 40px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 48px; align-items: center; }
.eyebrow { display: inline-block; font: 600 14px var(--body); color: var(--blue); background: #E6EFFF; border-radius: 999px; padding: 6px 12px; margin-bottom: 22px; }
.hero h1 { font-size: clamp(48px, 8vw, 96px); font-weight: 800; }
.hero h1 em { font-style: normal; color: var(--blue); }
.hero p.sub { font-size: clamp(18px, 2vw, 22px); color: var(--muted); max-width: 32ch; margin-top: 22px; }

/* Waitlist form */
form.wl { margin-top: 32px; display: grid; gap: 12px; max-width: 520px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row input[type=email] { flex: 1 1 220px; font: 500 17px var(--body); padding: 15px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-width: 0; }
.row button { font: 600 16px var(--body); padding: 15px 20px; border-radius: 16px; border: 0; background: var(--blue); color: #fff; cursor: pointer; }
.row button:hover { background: #1f68e8; }
.row button[disabled] { opacity: .6; cursor: progress; }
.consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.consent input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--blue); flex: none; }
.msg { font-size: 15px; font-weight: 600; min-height: 1.4em; }
.msg.ok { color: #0F8A4F; } .msg.err { color: #C2322C; }

/* Phone mock */
.stage { position: relative; display: flex; justify-content: center; }
.phone { width: min(330px, 100%); aspect-ratio: 9 / 18.5; background: var(--night); border-radius: 46px; padding: 14px; box-shadow: 0 40px 80px -30px rgba(22,24,58,.45), inset 0 0 0 2px #2c2f5c; position: relative; }
.screen { height: 100%; border-radius: 34px; background: radial-gradient(120% 80% at 50% 0%, #2a2c66 0%, #16183A 60%); padding: 52px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

.rain { display: flex; align-items: center; gap: 8px; font: 600 12px var(--body); color: #BFD9FF; background: rgba(90,176,255,.14); border-radius: 12px; padding: 8px 10px; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

/* Hero animation: a live phone screen, drawn at 300x646 and scaled to the phone. */
.kvw { position: absolute; inset: 14px; border-radius: 34px; overflow: hidden; background: #F3F6FC; }

.kv .status { left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 30px; font: 600 14px var(--body); direction: ltr; }

.kv .mic { width: 38px; height: 38px; border-radius: 50%; background: #2F7BFF; display: grid; place-items: center; position: relative; }

.kv .cd { background: #fff; border: 1px solid #E3E6F0; border-radius: 20px; padding: 12px; box-shadow: 0 14px 30px -20px rgba(13,19,48,.35); opacity: 0; }
.kv .ttl { display: flex; align-items: center; gap: 8px; font: 700 15px var(--display); letter-spacing: -.01em; }
.kv .sub { color: #5B6482; font-size: 12.5px; font-weight: 500; }
.kv .btn { margin-top: 10px; height: 40px; border-radius: 13px; background: #2F7BFF; color: #fff; font: 600 14px var(--body); display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; }
.kv .rip { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.55); left: 50%; top: 50%; opacity: 0; }
.kv .ico-ok { display: none; }
/* weather */
.kv .hrs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; direction: ltr; }
.kv .h { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 7px 0; border-radius: 13px; font-size: 12px; color: #5B6482; font-weight: 600; position: relative; }

.kv .h > *:not(.hl) { position: relative; }
/* train */
.kv .times { display: flex; align-items: center; gap: 8px; font: 700 19px var(--display); letter-spacing: -.02em; margin: 10px 0 8px; direction: ltr; }
.kv .ln { flex: 1; height: 2px; background: repeating-linear-gradient(90deg, #B9C2DA 0 5px, transparent 5px 9px); position: relative; }

.kv .more span { flex: 1; height: 28px; border-radius: 9px; background: #F2F4FA; font-size: 12.5px; font-weight: 600; color: #5B6482; display: grid; place-items: center; }
/* maps */
.kv .map { position: relative; height: 132px; border-radius: 14px; overflow: hidden; background: #EAEFF7; direction: ltr; }
.kv .stop { position: absolute; width: 24px; height: 24px; margin: -12px; border-radius: 50%; background: #2F7BFF; color: #fff; font: 700 13px var(--body); display: grid; place-items: center; border: 2px solid #fff; box-shadow: 0 4px 10px -4px rgba(13,19,48,.5); transform: scale(0); }
.kv .rows { display: grid; gap: 5px; margin-top: 9px; }
.kv .row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; opacity: 0; }
.kv .row i { font-style: normal; width: 20px; height: 20px; border-radius: 50%; background: #E6EFFF; color: #2F7BFF; font-size: 11.5px; display: grid; place-items: center; flex: none; }
.kv .foot { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: #2F7BFF; font-size: 12.5px; font-weight: 600; opacity: 0; }
.kv .pin { position: absolute; width: 26px; height: 33px; margin: -33px 0 0 -13px; transform-origin: 50% 100%; transform: scale(0); }
/* activity */
.kv .pic { height: 104px; border-radius: 14px; overflow: hidden; margin-bottom: 9px; }
.kv .stars { display: flex; gap: 2px; align-items: center; margin-top: 4px; }
/* plan */
.kv .tl { display: grid; gap: 6px; margin-top: 9px; }
.kv .tl div { display: flex; align-items: center; gap: 9px; font-size: 13.5px; font-weight: 600; opacity: 0; }
.kv .tl b { font: 600 12.5px var(--body); color: #5B6482; width: 40px; direction: ltr; }
.kv .tl i { width: 8px; height: 8px; border-radius: 50%; background: #2F7BFF; flex: none; }
.kv .sent { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 13px; font-weight: 600; color: #0F8A4F; opacity: 0; }
.kv .av { width: 26px; height: 26px; border-radius: 50%; background: #FF8A65; color: #fff; font: 700 12px var(--body); display: grid; place-items: center; position: relative; }
/* restaurant */
.kv .acts { display: flex; gap: 8px; }
.kv .acts .btn { flex: 1; }
.kv .acts .ghost { background: #E6EFFF; color: #2F7BFF; }
/* night chat */
.kv .n .u { background: #5AB0FF; color: #04101F; }
.kv .n .u .cur { background: #04101F; }
.kv .n .k { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.12); color: #fff; display: flex; gap: 8px; align-items: center; }
/* lock screen */
.kv .lock { inset: 0; opacity: 0; color: #fff; }
.kv .clock { position: absolute; top: 92px; left: 0; right: 0; text-align: center; font: 700 74px var(--display); letter-spacing: -.05em; direction: ltr; }
.kv .lk { position: absolute; top: 60px; left: 50%; margin-left: -9px; }
.kv .la { position: absolute; left: 14px; right: 14px; top: 290px; border-radius: 26px; background: rgba(255,255,255,.12); padding: 14px 16px 16px; opacity: 0; }
.kv .larow { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.kv .larow img { width: 34px; }
.kv .larow .min { margin-inline-start: auto; font: 700 22px var(--display); letter-spacing: -.03em; }
.kv .track { position: relative; height: 10px; border-radius: 6px; background: rgba(255,255,255,.16); margin: 24px 22px 6px 4px; direction: ltr; }
.kv .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: #5AB0FF; }
.kv .walker { position: absolute; top: -26px; width: 22px; height: 22px; margin-left: -11px; }
.kv .home { position: absolute; right: -18px; top: -8px; }
.kv .done { position: absolute; left: 50%; top: 440px; width: 72px; height: 72px; margin-left: -36px; border-radius: 50%; background: #22C47A; display: grid; place-items: center; transform: scale(0); }
.kv .burst { position: absolute; left: 50%; top: 440px; width: 72px; height: 72px; margin-left: -36px; border-radius: 50%; border: 3px solid #22C47A; opacity: 0; }
.kv .arr { position: absolute; left: 20px; right: 20px; top: 530px; text-align: center; font-weight: 600; font-size: 16px; opacity: 0; }
.kv .fade { position: absolute; inset: 0; background: linear-gradient(180deg, #E4EEFF 0%, #F3F6FC 45%, #F6F7FB 100%); }
.kv .ntf { position: absolute; left: 12px; right: 12px; top: 176px; border-radius: 20px; background: rgba(255,255,255,.92); color: #0D1330; padding: 10px 12px; display: flex; gap: 10px; align-items: center; opacity: 0; box-shadow: 0 16px 30px -18px rgba(0,0,0,.6); }
.kv .ntf img { width: 34px; } .kv .ntf b { display: block; font-size: 12px; color: #5B6482; } .kv .ntf span { font-weight: 700; font-size: 14.5px; }
.kv .dim { position: absolute; inset: 0; background: rgba(8,9,26,.6); opacity: 0; }
.kv .chk { position: absolute; left: 16px; right: 16px; top: 150px; border-radius: 26px; background: #fff; color: #0D1330; padding: 18px 16px 16px; text-align: center; opacity: 0; box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); }
.kv .chk img { width: 54px; margin: 0 auto 6px; }
.kv .chk .ct { font: 800 22px var(--display); letter-spacing: -.02em; }
.kv .chk .cb { color: #5B6482; font-size: 13.5px; margin-top: 4px; }
.kv .chk .cnt { width: 44px; height: 44px; margin: 12px auto 4px; border-radius: 50%; border: 3px solid #FFB020; display: grid; place-items: center; font: 700 16px var(--body); color: #B26B00; }
.kv .chk .btn { margin-top: 10px; height: 44px; font-size: 15px; }
.kv .chk .red { background: #E5484D; box-shadow: 0 0 0 0 rgba(229,72,77,.5); }

/* caption + controls under the phone */
.stage { flex-direction: column; align-items: center; }
.vcap { margin-top: 22px; min-height: 2.8em; max-width: 340px; text-align: center; font: 600 18px var(--body); color: var(--ink); transition: opacity .3s ease; text-wrap: balance; }
.vdots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.vdots i { width: 6px; height: 6px; border-radius: 6px; background: var(--line); transition: width .3s ease, background .3s ease; }
.vdots i.on { width: 20px; background: var(--blue); }
.snd { position: absolute; z-index: 2; top: 18px; inset-inline-end: -18px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 24px -14px rgba(13,19,48,.4); }
.snd svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.snd .on { display: none; }
.snd[aria-pressed=true] .on { display: block; } .snd[aria-pressed=true] .off { display: none; }
.snd[aria-pressed=true] { background: var(--ink); } .snd[aria-pressed=true] svg { stroke: #fff; }
.stage .phone { width: min(300px, 100%); }
.vcap { margin-top: 16px; }
.mascot { bottom: 84px; }
@media (max-width: 860px) { .mascot { width: 84px; left: -22px; bottom: 100px; } [dir=rtl] .mascot { left: auto; right: -14px; } }
@media (min-width: 861px) { .hero { padding-top: 40px; } }


/* Three words */
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 72px 0; border-top: 1px solid var(--line); margin-top: 48px; }
.trio h2 { font-size: clamp(44px, 6vw, 76px); font-weight: 800; }
.trio div:nth-child(2) h2 { color: var(--blue); }
.trio p { color: var(--muted); font-size: 18px; margin-top: 12px; max-width: 26ch; }

/* Features */
section.features { padding: 24px 0 96px; }
.sec-title { font-size: clamp(34px, 4.6vw, 56px); font-weight: 800; max-width: 18ch; margin-bottom: 40px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 26px 22px; display: flex; flex-direction: column; gap: 10px; transition: transform .2s ease, box-shadow .2s ease; }
.tile:hover { transform: translateY(-3px); box-shadow: 0 16px 40px -24px rgba(13,19,48,.35); }
.tile svg { width: 30px; height: 30px; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile h3 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.tile p { color: var(--muted); font-size: 15px; }

/* Night: safety */
section.night { background: var(--night); color: var(--night-ink); padding: 104px 0; }
.night-in { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
.night .tag { font: 600 14px var(--body); color: #5AB0FF; letter-spacing: .02em; }
.night h2 { font-size: clamp(38px, 5.4vw, 68px); font-weight: 800; margin-top: 14px; }
.night p.lead { color: #B9C2DA; font-size: 19px; margin-top: 18px; max-width: 34ch; }
.night ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; }
.night li { display: flex; gap: 12px; align-items: center; font-weight: 500; }
.night li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: #5AB0FF; flex: none; }
.lock { justify-self: center; width: min(360px, 100%); border-radius: 36px; padding: 28px 22px; background: linear-gradient(160deg, #262a64, #121434); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.lock .time { font: 700 64px var(--display); text-align: center; letter-spacing: -0.04em; }
.lock .date { text-align: center; color: #B9C2DA; font-size: 15px; margin-bottom: 26px; }
.live { background: rgba(255,255,255,.1); border-radius: 22px; padding: 16px; display: grid; gap: 10px; }
.live b { font: 700 15px var(--body); }
.live span { color: #B9C2DA; font-size: 13px; }
.bar-track { height: 8px; background: rgba(255,255,255,.15); border-radius: 8px; overflow: hidden; }
.bar-fill { height: 100%; width: 72%; background: #FFB020; border-radius: 8px; animation: lkFill 14s linear infinite; }
/* Lock screen loop (14 s): walk, late, "Everything OK?" with 112, "I'm OK", arrive. Base styles = the late frame (reduced motion). */
.live-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.stack { display: grid; } .stack > * { grid-area: 1 / 1; }
.lk-eta { opacity: 0; animation: lkEta 14s linear infinite; }
.lk-late { color: #FFB020 !important; font-weight: 600; animation: lkLate 14s linear infinite; }
.lk-arr { color: #6EE7A8 !important; font-weight: 600; opacity: 0; animation: lkArr 14s linear infinite; }
.lock .time .t1, .lock .time .t3 { opacity: 0; } .lock .time .t1 { animation: lkT1 14s linear infinite; } .lock .time .t2 { animation: lkT2 14s linear infinite; } .lock .time .t3 { animation: lkT3 14s linear infinite; }
.lk-alert { margin-top: 14px; background: #fff; color: #0D1330; border-radius: 22px; padding: 16px; text-align: center; animation: lkAlert 14s ease-out infinite; }
.lk-alert b { display: block; font: 800 20px var(--display); letter-spacing: -.02em; }
.lk-alert p { color: #5B6482; font-size: 13.5px; margin: 4px 0 12px; }
.lk-btn { border-radius: 13px; padding: 11px; font: 600 14.5px var(--body); color: #fff; display: flex; justify-content: center; align-items: center; gap: 8px; }
.lk-ok { background: #2F7BFF; animation: lkOk 14s linear infinite; }
.lk-help { background: #E5484D; margin-top: 8px; animation: lkHelp 14s ease-in-out infinite; }
@keyframes lkFill { 0% { width: 40%; background: #5AB0FF; } 22% { width: 72%; background: #5AB0FF; } 25%, 66% { width: 72%; background: #FFB020; } 69% { width: 72%; background: #5AB0FF; } 83% { width: 100%; background: #5AB0FF; } 85%, 97% { width: 100%; background: #22C47A; } 100% { width: 40%; background: #5AB0FF; } }
@keyframes lkEta { 0%, 23% { opacity: 1; } 25%, 67% { opacity: 0; } 69%, 83% { opacity: 1; } 85%, 100% { opacity: 0; } }
@keyframes lkLate { 0%, 23% { opacity: 0; } 25%, 66% { opacity: 1; } 68%, 100% { opacity: 0; } }
@keyframes lkArr { 0%, 84% { opacity: 0; } 86%, 97% { opacity: 1; } 99%, 100% { opacity: 0; } }
@keyframes lkT1 { 0%, 24% { opacity: 1; } 26%, 100% { opacity: 0; } }
@keyframes lkT2 { 0%, 24% { opacity: 0; } 26%, 82% { opacity: 1; } 84%, 100% { opacity: 0; } }
@keyframes lkT3 { 0%, 82% { opacity: 0; } 84%, 98% { opacity: 1; } 100% { opacity: 0; } }
@keyframes lkAlert { 0%, 29% { opacity: 0; transform: translateY(14px) scale(.97); } 33%, 64% { opacity: 1; transform: none; } 68%, 100% { opacity: 0; transform: translateY(-8px); } }
@keyframes lkOk { 0%, 59% { background: #2F7BFF; transform: none; } 61% { background: #2F7BFF; transform: scale(.95); } 63%, 100% { background: #22C47A; transform: none; } }
@keyframes lkHelp { 0%, 38% { box-shadow: 0 0 0 0 rgba(229,72,77,0); } 42% { box-shadow: 0 0 0 7px rgba(229,72,77,.35); } 46% { box-shadow: 0 0 0 0 rgba(229,72,77,0); } 50% { box-shadow: 0 0 0 7px rgba(229,72,77,.35); } 54%, 100% { box-shadow: 0 0 0 0 rgba(229,72,77,0); } }

/* Privacy */
section.priv { padding: 104px 0 64px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.three h3 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.three p { color: var(--muted); margin-top: 8px; }
.three div { border-top: 2px solid var(--ink); padding-top: 18px; }

/* Languages */
section.langs { padding: 40px 0 96px; text-align: center; }
.langs h2 { font-size: clamp(34px, 4.6vw, 56px); font-weight: 800; }
.langs p { color: var(--muted); margin-top: 10px; }
.lang-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
.lang-list button { font: 600 16px var(--body); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 10px 18px; cursor: pointer; }
.lang-list button[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Final CTA */
section.cta { padding: 96px 0; background: var(--card); border-top: 1px solid var(--line); }
.cta-in { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; }
.cta h2 { font-size: clamp(40px, 6vw, 80px); font-weight: 800; }
.cta p { color: var(--muted); font-size: 19px; margin-top: 14px; }
.cta img { width: 170px; }

footer { padding: 36px 0 48px; color: var(--muted); font-size: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 14px 28px; justify-content: space-between; align-items: center; }
.foot nav { display: flex; gap: 20px; flex-wrap: wrap; }
#privacidad { max-width: 70ch; margin-top: 18px; font-size: 13px; }

@media (max-width: 920px) {
  .hero, .night-in, .cta-in { grid-template-columns: 1fr; }
  .hero { padding-top: 48px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .trio, .three { grid-template-columns: 1fr; gap: 28px; }
  .cta img { display: none; }
}
@media (max-width: 520px) {
  .grid { grid-template-columns: 1fr; }
  .mascot { width: 110px; left: -10px; }
  [dir=rtl] .mascot { right: -10px; }
  .row button { flex: 1 1 100%; }
  .nav-cta { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

  lang = LANGS.includes(saved) ? saved : LANGS.includes(nav) ? nav : 'es';
} catch (e) {}

const sel = document.getElementById('lang');
const list = document.getElementById('langList');
LANGS.forEach((l) => {
  const o = document.createElement('option'); o.value = l; o.textContent = T[l].lang_name; sel.appendChild(o);
  const b = document.createElement('button'); b.type = 'button'; b.textContent = T[l].lang_name; b.lang = l; b.dataset.l = l;
  b.addEventListener('click', () => setLang(l)); list.appendChild(b);
});
sel.addEventListener('change', () => setLang(sel.value));

function setLang(l) {
  lang = l;
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = t[el.dataset.i] ?? ''; });
  document.querySelectorAll('[data-ph]').forEach((el) => { el.placeholder = t[el.dataset.ph]; });
  document.title = 'Kaminu · ' + t.hero_title.replace(/[.。!！]$/, '');
  sel.value = l;
  list.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.l === l)));
  document.querySelectorAll('.msg').forEach((m) => { m.textContent = ''; m.className = 'msg'; });
  try { localStorage.setItem('kaminu.lang', l); } catch (e) {}
  if (window.kvLabel) window.kvLabel();
}
setLang(lang);

document.querySelectorAll('form.wl').forEach((form) => {
  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const t = T[lang];
    const email = form.querySelector('input[type=email]');
    const consent = form.querySelector('input[type=checkbox]');
    const msg = form.querySelector('.msg');
    const btn = form.querySelector('button');
    const value = email.value.trim().toLowerCase();
    msg.className = 'msg';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(value)) { msg.textContent = t.form_err; msg.classList.add('err'); email.focus(); return; }
    if (!consent.checked) { msg.textContent = t.form_need; msg.classList.add('err'); consent.focus(); return; }
    btn.disabled = true;
    try {
      const r = await fetch(SUPABASE + '/rest/v1/waitlist?on_conflict=email', {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json', Prefer: 'return=minimal,resolution=ignore-duplicates' },
        body: JSON.stringify({ email: value, lang, consent: true }),
      });
      if (!r.ok) throw new Error(String(r.status));
      msg.textContent = t.form_ok; msg.classList.add('ok'); form.reset();
    } catch (e) {
      msg.textContent = t.form_err; msg.classList.add('err');
    } finally { btn.disabled = false; }
  });
});
</script>
<script>
// Hero animation: 35 s loop drawn live in the phone; texts follow the page language (T, lang).
(function () {
  const kv = document.getElementById('kv');
  if (!kv) return;
  const $ = (id) => document.getElementById(id);
  const cl = (x) => Math.max(0, Math.min(1, x));
  const p = (t, a, b) => cl((t - a) / (b - a));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = (x) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const L = 39;
  const S = [0, 4.6, 9.2, 13.8, 18.4, 23.0, 27.6]; // scene starts
  const END = [4.6, 9.2, 13.8, 18.4, 23.0, 27.6, 39];
  const N6 = S[6];

  // fill hours, stars
  const SUN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F5A524" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#FFD25E"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>';
  const CS = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="9" cy="9" r="3.4" fill="#FFD25E" stroke="#F5A524"/><path d="M8 19a4 4 0 1 1 1.6-7.7A5 5 0 0 1 19 13a3 3 0 0 1-1 6z" fill="#fff" stroke="#9AA3BE"/></svg>';
  const RAIN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M7 15a4 4 0 1 1 1.5-7.7A5 5 0 0 1 18 9a3 3 0 0 1 0 6z" fill="#DCE6F8" stroke="#6E86B8"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5" stroke="#2F7BFF"/></svg>';
  $('kvH').innerHTML = [[10, SUN, 19], [12, SUN, 21], [14, CS, 22], [16, RAIN, 18], [18, RAIN, 17]]
    .map(([h, ic, tp], i) => `<div class="h">${i === 3 ? '<div class="hl"></div>' : ''}<b>${h}</b>${ic}<span>${tp}°</span></div>`).join('');
  const STAR = (f) => `<svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="${f}"/></svg>`;
  $('kvSt4').innerHTML = [1, 1, 1, 1, 0.5].map((f) => STAR(f === 1 ? '#FFB020' : '#FFD98A')).join('') + '<span class="sub" style="margin-inline-start:6px">4,7</span>';
  $('kvSt6').innerHTML = [1, 1, 1, 1, 1].map(() => STAR('#FFB020')).join('');
  const PIN = (c) => `<svg width="26" height="33" viewBox="0 0 30 38"><path d="M15 37C15 37 2 23 2 14a13 13 0 0 1 26 0c0 9-13 23-13 23z" fill="${c}"/><path d="M11 8v6a2 2 0 0 0 4 0V8M13 14v8M19 8c-1.5 1.5-1.5 5 0 6v8" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  const pins = kv.querySelectorAll('#g5 .pin');
  pins.forEach((el, i) => { el.innerHTML = PIN(i === 1 ? '#FF5A3C' : '#FF8A6B'); });

  const G = [...Array(7)].map((_, i) => $('g' + i));
  const parts = G.map((g) => ({
    u: g.querySelector('.u'), span: g.querySelector('.u span'), cur: g.querySelector('.u .cur'),
    dots: g.querySelector('.dots'), cards: [...g.querySelectorAll(':scope > .cd')],
    btn: g.querySelector('.btn:not(.ghost)'),
  }));
  const route = $('kvR'), RL = route.getTotalLength();
  const route6 = $('kvR6'), RL6 = route6.getTotalLength();
  const stops = kv.querySelectorAll('#g2 .stop'), rows = kv.querySelectorAll('#g2 .row');
  const tl = kv.querySelectorAll('#g4 .tl div');
  const cap = document.getElementById('vcap'), dots = [...document.querySelectorAll('#vdots i')];

  function appear(el, t, a, dur = 0.45, dy = 18) { const k = p(t, a, a + dur), e = eo(k); el.style.opacity = e; el.style.transform = `translateY(${(1 - e) * dy}px) scale(${0.95 + 0.05 * (k ? back(k) : 0)})`; }
  function pop(el, t, a, dur = 0.4) { const k = p(t, a, a + dur); el.style.transform = `scale(${k ? back(k) : 0})`; }
  function tap(btn, t, a) {
    if (!btn) return;
    const rip = btn.querySelector('.rip'), k = p(t, a, a + 0.4);
    rip.style.opacity = k ? 1 - k : 0; rip.style.transform = `translate(-50%,-50%) scale(${k ? 1 + 7 * eo(k) : 0})`;
    const ok = t >= a + 0.2;
    btn.style.background = ok ? '#22C47A' : ''; btn.querySelector('.ico').style.display = ok ? 'none' : '';
    btn.querySelector('.ico-ok').style.display = ok ? 'block' : 'none';
    btn.style.transform = `scale(${1 - 0.04 * Math.sin(p(t, a - 0.1, a + 0.15) * Math.PI)})`;
  }
  const T0 = () => (typeof T !== 'undefined' && T[lang]) || {};

  function render(t) {
    const tx = T0();
    let sc = 0; while (sc < 6 && t >= S[sc + 1]) sc++;
    // night
    const nk = eio(p(t, N6 - 0.2, N6 + 0.5));
    $('kvN').style.opacity = nk;
    $('kvSt').style.color = nk > 0.5 ? '#fff' : '#0D1330';
    $('kvT').textContent = ['9:41', '9:58', '10:16', '10:31', '10:44', '20:52', '23:38'][sc];
    $('kvT').style.opacity = 1 - p(t, N6 + 3.2, N6 + 3.5);
    const inp = $('kvIn');
    inp.style.background = nk > 0.5 ? 'rgba(255,255,255,.1)' : '#fff';
    inp.style.borderColor = nk > 0.5 ? 'rgba(255,255,255,.12)' : '#E3E6F0';
    $('kvMic').style.background = nk > 0.5 ? '#5AB0FF' : '#2F7BFF';
    // mic pulse while dictating
    const s0 = S[sc], speaking = t >= s0 + 0.1 && t <= s0 + 1.3;
    const ph = (t * 1.6) % 1, ring = $('kvRing');
    ring.style.borderColor = nk > 0.5 ? '#5AB0FF' : '#2F7BFF';
    ring.style.opacity = speaking ? (1 - ph) * 0.8 : 0; ring.style.transform = `scale(${1 + 0.7 * ph})`;
    $('kvMic').style.transform = `scale(${speaking ? 1.08 : 1})`;
    // groups
    G.forEach((g, i) => {
      const s = S[i], e = i === 6 ? N6 + 3.2 : END[i] - 0.45;
      const k = eio(p(t, e, e + 0.45));
      const vis = t >= s && t < e + 0.45;
      g.style.display = vis ? 'flex' : 'none';
      if (!vis) return;
      g.style.opacity = 1 - k; g.style.transform = `translateY(${-50 * k}px)`;
      const q = parts[i], full = tx[q.span.dataset.d] || '';
      appear(q.u, t, s + 0.12, 0.3, 10);
      const n = Math.round(full.length * eio(p(t, s + 0.2, s + 1.2)));
      if (q.span.textContent.length !== n || q.span.dataset.l !== lang) { q.span.textContent = full.slice(0, n); q.span.dataset.l = lang; }
      q.cur.style.opacity = t < s + 1.3 && (t * 2.5) % 1 < 0.6 ? 1 : 0;
      const on = t >= s + 1.3 && t < s + 1.75;
      q.dots.style.display = on ? 'flex' : 'none';
      if (on) [...q.dots.children].forEach((d, j) => { d.style.transform = `translateY(${-3 * Math.max(0, Math.sin((t - s) * 10 - j * 0.9))}px)`; });
      q.cards.forEach((c, j) => { c.style.display = t >= s + 1.75 + j * 0.25 ? '' : 'none'; appear(c, t, s + 1.75 + j * 0.25, 0.5, 22); });
    });
    // scene details
    const hs = kv.querySelectorAll('#g0 .h');
    hs.forEach((h, i) => { const k = p(t, 2.1 + i * 0.07, 2.45 + i * 0.07); h.style.opacity = eo(k); h.style.transform = `translateY(${(1 - eo(k)) * 8}px)`; });
    const hl = kv.querySelector('#g0 .hl'), hk = p(t, 2.9, 3.25); hl.style.opacity = eo(hk); hl.style.transform = `scale(${0.85 + 0.15 * (hk ? back(hk) : 0)})`;
    $('kvTd').style.left = `${eio(p(t, S[1] + 2.0, S[1] + 3.6)) * 100}%`;
    tap(parts[1].btn, t, S[1] + 3.2);
    const rk = eio(p(t, S[2] + 2.3, S[2] + 3.6)); route.style.strokeDasharray = `${rk * RL} 999`;
    stops.forEach((s, i) => pop(s, t, S[2] + 2.0 + i * 0.65, 0.4));
    rows.forEach((r, i) => { const k = p(t, S[2] + 2.2 + i * 0.45, S[2] + 2.55 + i * 0.45); r.style.opacity = eo(k); r.style.transform = `translateX(${(1 - eo(k)) * 10}px)`; });
    const ft = kv.querySelector('#g2 .foot'); ft.style.opacity = eo(p(t, S[2] + 3.5, S[2] + 3.85));
    tap(parts[3].btn, t, S[3] + 3.2);
    tl.forEach((r, i) => { const k = p(t, S[4] + 1.95 + i * 0.13, S[4] + 2.3 + i * 0.13); r.style.opacity = eo(k); r.style.transform = `translateX(${(1 - eo(k)) * 10}px)`; });
    tap(parts[4].btn, t, S[4] + 3.1);
    const se = kv.querySelector('#g4 .sent'); appear(se, t, S[4] + 3.4, 0.4, 8);
    pins.forEach((pn, i) => { const base = t >= S[5] + 1.95 + i * 0.12 ? back(p(t, S[5] + 1.95 + i * 0.12, S[5] + 2.35 + i * 0.12)) : 0; pn.style.transform = `scale(${base * (i === 1 ? 1 + 0.25 * eo(p(t, S[5] + 2.6, S[5] + 2.9)) : 1)})`; });
    route6.style.strokeDasharray = `${eio(p(t, S[5] + 2.6, S[5] + 3.2)) * RL6} 999`;
    tap(parts[5].btn, t, S[5] + 3.45);
    // lock screen
    const lk = eio(p(t, N6 + 3.2, N6 + 3.7));
    $('kvApp').style.opacity = 1 - lk;
    $('kvL').style.opacity = lk;
    const la = $('kvLa'), lak = p(t, N6 + 3.5, N6 + 4.0); la.style.opacity = eo(lak); la.style.transform = `translateY(${(1 - eo(lak)) * 26}px)`;
    // walk, stall (late), check with 112, "I'm OK", walk on, arrive
    const f1 = eio(p(t, N6 + 3.9, N6 + 5.0)), f2 = eio(p(t, N6 + 8.9, N6 + 9.8));
    const late = t >= N6 + 5.1 && t < N6 + 8.9;
    const pos = 40 + 32 * f1 + 28 * f2;
    $('kvF').style.width = $('kvW').style.left = pos + '%';
    $('kvW').style.opacity = 1 - p(t, N6 + 9.7, N6 + 9.85);
    const done = t >= N6 + 9.85;
    const col = done ? '#22C47A' : late ? '#FFB020' : '#5AB0FF';
    $('kvF').style.background = col; $('kvHb').setAttribute('fill', done ? '#22C47A' : '#5AB0FF');
    const mEl = $('kvM');
    if (late) { mEl.textContent = tx.v_late || ''; mEl.style.color = '#FFB020'; mEl.style.fontSize = '15px'; }
    else { mEl.textContent = (t < N6 + 5.1 ? Math.round(11 - 7 * f1) : Math.max(0, Math.round(4 * (1 - f2)))) + '′'; mEl.style.color = ''; mEl.style.fontSize = ''; }
    $('kvC').textContent = t < N6 + 4.4 ? '23:41' : t < N6 + 5.1 ? '23:46' : t < N6 + 9.0 ? '23:58' : '00:04';
    // notification banner, then the check
    const nb = p(t, N6 + 5.3, N6 + 5.6), nbo = p(t, N6 + 5.95, N6 + 6.15);
    $('kvNt').style.opacity = eo(nb) * (1 - nbo); $('kvNt').style.transform = `translateY(${(1 - eo(nb)) * -40}px)`;
    const ko = p(t, N6 + 6.0, N6 + 6.4), kc = p(t, N6 + 8.55, N6 + 8.85);
    $('kvDim').style.opacity = eo(ko) * (1 - kc);
    const K = $('kvK'); K.style.opacity = eo(ko) * (1 - kc); K.style.transform = `translateY(${(1 - eo(ko)) * 30 + eo(kc) * 20}px) scale(${0.96 + 0.04 * eo(ko)})`;
    K.style.display = t >= N6 + 6.0 && t < N6 + 8.85 ? '' : 'none';
    $('kvCnt').textContent = String(Math.max(0, 20 - Math.floor((t - (N6 + 6.0)) * 3)));
    const hp = p(t, N6 + 6.7, N6 + 8.0), g = Math.sin(hp * Math.PI * 3);
    $('kvHelp').style.boxShadow = hp > 0 && hp < 1 ? `0 0 0 ${6 * Math.abs(g)}px rgba(229,72,77,${0.35 * Math.abs(g)})` : 'none';
    const okb = $('kvOk'), rk2 = p(t, N6 + 8.2, N6 + 8.6);
    okb.querySelector('.rip').style.opacity = rk2 ? 1 - rk2 : 0; okb.querySelector('.rip').style.transform = `translate(-50%,-50%) scale(${rk2 ? 1 + 7 * eo(rk2) : 0})`;
    okb.style.background = t >= N6 + 8.35 ? '#22C47A' : '';
    okb.style.transform = `scale(${1 - 0.04 * Math.sin(p(t, N6 + 8.1, N6 + 8.35) * Math.PI)})`;
    pop($('kvD'), t, N6 + 9.85, 0.45);
    const bk = p(t, N6 + 9.9, N6 + 10.5); $('kvB').style.opacity = bk ? 1 - bk : 0; $('kvB').style.transform = `scale(${1 + 1.2 * eo(bk)})`;
    appear($('kvA'), t, N6 + 10.0, 0.4, 10);
    $('kvFade').style.opacity = Math.max(1 - eo(p(t, 0, 0.35)), eio(p(t, L - 0.55, L)));
    // caption + dots
    let ck = Math.min(p(t, S[sc] + 0.05, S[sc] + 0.4), 1 - p(t, END[sc] - 0.35, END[sc]));
    if (sc === 6) ck = Math.min(ck, Math.max(1 - p(t, N6 + 4.85, N6 + 5.15), p(t, N6 + 5.2, N6 + 5.5)));
    const key = sc === 6 && t >= N6 + 5.2 ? 'c8' : 'c' + (sc + 1);
    if (cap.dataset.k !== key || cap.dataset.l !== lang) { cap.textContent = tx[key] || ''; cap.dataset.k = key; cap.dataset.l = lang; }
    cap.style.opacity = ck;
    dots.forEach((d, i) => d.classList.toggle('on', i === sc));
  }

  // scale the 300x646 drawing to the phone screen
  const box = kv.parentElement;
  const fit = () => { kv.style.transform = `scale(${box.clientWidth / 300})`; };
  if (window.ResizeObserver) new ResizeObserver(fit).observe(box); fit();

  // music: Web Audio loop, started only by the button
  const btn = document.getElementById('snd');
  let ctx = null, buf = null, src = null, gain = null, audioT0 = 0, playing = false;
  let clockStart = performance.now() / 1000, visible = true, pausedAt = null;
  const now = () => performance.now() / 1000;
  const time = () => (pausedAt !== null ? pausedAt : (now() - clockStart)) % L;
  async function startMusic() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();
    if (!buf) { const r = await fetch('kaminu-music.m4a'); buf = await ctx.decodeAudioData(await r.arrayBuffer()); }
    gain = ctx.createGain(); gain.gain.value = 0; gain.connect(ctx.destination);
    src = ctx.createBufferSource(); src.buffer = buf; src.loop = true; src.loopStart = 0; src.loopEnd = Math.min(L, buf.duration);
    src.connect(gain);
    const t = time(); src.start(0, t % src.loopEnd);
    gain.gain.linearRampToValueAtTime(0.55, ctx.currentTime + 1.2);
    playing = true;
  }
  function stopMusic() {
    if (src && gain && ctx) { const s = src; gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); setTimeout(() => { try { s.stop(); } catch (e) {} }, 450); }
    src = null; playing = false;
  }
  function label() { const tx = T0(); btn.setAttribute('aria-label', playing ? (tx.v_mute || '') : (tx.v_sound || '')); btn.setAttribute('aria-pressed', String(playing)); }
  btn.addEventListener('click', async () => { try { if (playing) stopMusic(); else await startMusic(); } catch (e) { playing = false; } label(); });
  window.kvLabel = label;

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { render(3.9); btn.style.display = 'none'; return; }
  if (window.IntersectionObserver) new IntersectionObserver((es) => {
    visible = es[0].isIntersecting;
    if (!visible && pausedAt === null) { pausedAt = now() - clockStart; if (playing) { stopMusic(); label(); } }
    else if (visible && pausedAt !== null) { clockStart = now() - pausedAt; pausedAt = null; }
  }).observe(box);
  document.addEventListener('visibilitychange', () => { if (document.hidden && playing) { stopMusic(); label(); } });
  function frame() { if (pausedAt === null) render(time()); requestAnimationFrame(frame); }
  window.kvRender = render;
  label(); frame();
})();

</script>
